name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Pruebas (incluye criterios de aceptación T-I19-01 … 05)
        shell: bash
        run: |
          set -o pipefail
          python run.py test 2>&1 | tee pytest.log
      - name: Publicar pruebas fallidas
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error title=pytest::/' || true
      - name: Demo de punta a punta
        run: python run.py demo
      - name: Indicadores de validación
        run: python run.py evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-${{ matrix.os }}
          path: |
            demo_output/
            reports/metrics.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t k-procurematch:ci .
      - name: API en contenedor y consumo real de sus endpoints
        run: |
          docker network create kpm
          docker run -d --name kpm-api --network kpm -p 8000:8000 k-procurematch:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          RID=$(curl -fsS -X POST http://127.0.0.1:8000/runs -H 'content-type: application/json' \
                -d '{"as_of":"2026-03-31"}' | python3 -c "import json,sys;print(json.load(sys.stdin)['run_id'])")
          curl -fsS "http://127.0.0.1:8000/runs/$RID/summary" | python3 -c \
            "import json,sys;d=json.load(sys.stdin);assert sum(d['por_estado'].values())==d['lineas']==749,d;print(d['por_estado'])"
          curl -fsS -o expediente.zip "http://127.0.0.1:8000/runs/$RID/export"
          python3 -c "import zipfile;n=zipfile.ZipFile('expediente.zip').namelist();assert any(x.endswith('manifest.json') for x in n);print(n)"
          curl -fsS -X POST http://127.0.0.1:8000/datasets \
            -F purchase_orders=@data/sample/purchase_orders.csv -F goods_receipts=@data/sample/goods_receipts.csv \
            -F invoice_lines=@data/sample/invoice_lines.csv | python3 -c "import json,sys;print(json.load(sys.stdin)['dataset_id'])"
      - name: Dashboard en contenedor consumiendo la API en contenedor
        run: |
          docker run -d --name kpm-dash --network kpm -e KPM_API_URL=http://kpm-api:8000 -p 8501:8501 \
            k-procurematch:ci streamlit run dashboard/app.py --server.address=0.0.0.0 --server.headless=true
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          docker run --rm -i --network kpm -e KPM_API_URL=http://kpm-api:8000 k-procurematch:ci python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception and not at.error, [e.value for e in at.exception] + [e.value for e in at.error]
          m = {x.label: x.value for x in at.metric}
          assert m["Líneas"] == "749" and m["Conciliadas"] == "660", m
          print("El dashboard en contenedor muestra", m["Líneas"], "líneas obtenidas de la API en contenedor")
          PY
      - if: failure()
        run: docker logs kpm-api; docker logs kpm-dash || true
