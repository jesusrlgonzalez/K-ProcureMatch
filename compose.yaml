services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["api_state:/app/state"]
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true"]
    environment:
      KPM_API_URL: http://api:8000        # el dashboard solo habla con la API
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 15s
      retries: 5
volumes:
  api_state:
